services:
  api:
    build: .
    restart: unless-stopped
    ports:
      - "8011:8011"
    environment:
      APP_NAME: Lingdong Rehab Cloud
      DATABASE_URL: postgresql+psycopg://rehab:rehab_password@postgres:5432/rehab
      JWT_SECRET: ${JWT_SECRET:-change-me-before-public-deploy}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_TTL_MINUTES: 10080
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: rehab
      POSTGRES_USER: rehab
      POSTGRES_PASSWORD: rehab_password
    volumes:
      - rehab_postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - rehab_redis:/data

volumes:
  rehab_postgres:
  rehab_redis:
